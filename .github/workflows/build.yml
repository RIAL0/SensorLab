name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run

      - name: Name the image
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION="build-${GITHUB_SHA::7}" ;; esac
          cp .pio/build/cardputer-adv/firmware.bin "SensorLab-CardputerADV-${VERSION}.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: SensorLab-firmware
          path: SensorLab-CardputerADV-*.bin

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SensorLab-CardputerADV-*.bin
          generate_release_notes: true
