name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this tag, e.g. v1.8 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run

      - name: Name the image
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME}"; fi
          case "$VERSION" in v*) ;; *) VERSION="build-${GITHUB_SHA::7}" ;; esac
          cp .pio/build/cardputer-adv/firmware.bin "SensorLab-CardputerADV-${VERSION}.bin"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: SensorLab-firmware
          path: SensorLab-CardputerADV-*.bin

      # Runs for a pushed v* tag, or for a manual run that names a version.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: SensorLab ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: SensorLab-CardputerADV-*.bin
          generate_release_notes: true
