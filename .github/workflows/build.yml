name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this tag, e.g. v1.8 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run

      - name: Name the image
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME}"; fi
          case "$VERSION" in v*) ;; *) VERSION="build-${GITHUB_SHA::7}" ;; esac
          cp .pio/build/cardputer-adv/firmware.bin "SensorLab-CardputerADV-${VERSION}.bin"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: SensorLab-firmware
          path: SensorLab-CardputerADV-*.bin

      # Release notes = this version's section of CHANGELOG.md, plus install instructions.
      - name: Write release notes
        run: |
          NUM="${VERSION#v}"
          awk -v ver="$NUM" '
            /^## / { if (found) exit; if ($2 == ver) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > section.md
          {
            echo "## What's new in ${VERSION}"
            if [ -s section.md ]; then cat section.md; else echo; echo "See the changelog."; echo; fi
            echo "## Install"
            echo
            echo "1. Download \`SensorLab-CardputerADV-${VERSION}.bin\` below and copy it to the microSD card."
            echo "2. In [M5Launcher](https://github.com/bmorcelli/Launcher), open **SD**, select the file and choose **Install**."
            echo
            echo "For the M5Stack Cardputer ADV. Full documentation and key maps are in the [README](https://github.com/${GITHUB_REPOSITORY}#readme); the complete history is in the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          } > release_notes.md
          cat release_notes.md

      # Runs for a pushed v* tag, or for a manual run that names a version.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: SensorLab ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: SensorLab-CardputerADV-*.bin
          body_path: release_notes.md
