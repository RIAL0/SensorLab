; SensorLab - hardware toolkit firmware for the M5Stack Cardputer ADV
; https://github.com/RIAL0/SensorLab
; Build:  pio run
; Output: .pio/build/cardputer-adv/firmware.bin  (copy to SD card, install with M5Launcher)

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -O2
lib_deps =
    m5stack/M5Unified@0.2.29
    m5stack/M5GFX@0.2.36
    m5stack/M5Cardputer@1.1.1
    h2zero/NimBLE-Arduino@1.4.3
    z3t0/IRremote@4.7.1
